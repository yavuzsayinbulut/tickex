server:
  port: 8082

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5435/event_db
    username: event_user
    password: ${EVENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    serialization:
      write-dates-as-timestamps: false
  cache:
    type: caffeine
    cache-names: featured-events,event-detail,event-search,sessions-by-event,venues
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

jwt:
  issuer: tickex-auth
  access-token:
    secret: ${AUTH_JWT_ACCESS_SECRET}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.tickex.eventservice: INFO
